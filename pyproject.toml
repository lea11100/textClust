[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textclust"
version = "0.1.0"
description = "Implementation and extention of textClust"
authors = [
  { name="Lea-Marie Sussek", email="sussekl@mail.uni-paderborn.de" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "graphviz>=0.21",
  "huggingface-hub>=1.6.0",
  "matplotlib>=3.10.8",
  "nltk>=3.9.3",
  "numpy>=2.4.2",
  "pandas>=3.0.1",
  "plotly>=6.6.0",
  "scikit-learn>=1.8.0",
  "seaborn>=0.13.2",
  "sentence-transformers>=5.2.3",
  "torch>=2.10.0",
  "transformers>=5.3.0",
]

[project.optional-dependencies]
offline-preprocessing = [
  "emoji>=2.14.0",
  "openai>=1.66.0",
  "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
exclude = ["build"]
ignore = ["build"]